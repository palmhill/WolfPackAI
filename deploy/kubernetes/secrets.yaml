apiVersion: v1
kind: Secret
metadata:
  name: wolfpackai-secrets
  namespace: wolfpackai
type: Opaque
stringData:
  # Base64 encode these values before deploying
  # Example: echo -n "your-password" | base64
  postgres-username: postgres
  postgres-password: CHANGE_ME_IN_PRODUCTION
  litellm-master-key: CHANGE_ME_IN_PRODUCTION
  n8n-auth-user: admin
  n8n-auth-password: CHANGE_ME_IN_PRODUCTION
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wolfpackai-config
  namespace: wolfpackai
data:
  POSTGRES_PORT: "5432"
  OLLAMA_HOST_PORT: "11434"
  LITELLM_PORT: "4000"
  OPENWEBUI_PORT: "8080"
  N8N_PORT: "5678"
  DASHBOARD_PORT: "80"
  OPENWEBUI_PUBLIC_URL: "http://localhost/chat"
  ENABLE_OAUTH: "false"
