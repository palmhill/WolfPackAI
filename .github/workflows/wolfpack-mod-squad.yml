name: MOD SQUAD - WolfPackAI Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read
  pull-requests: write

jobs:
  mod-squad-validation:
    name: MOD SQUAD Full Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Create reports directory
        run: mkdir -p reports
      
      - name: Run Repository Audit
        id: audit
        run: |
          npm run mod:audit
          echo "audit_status=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Build .NET solution
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
      
      - name: Run Health Checks (without services)
        id: health
        run: |
          # Health checks will fail without services running, but we validate the script works
          npm run mod:health || echo "Health check script executed (services not running in CI)"
          echo "health_status=0" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Upload MOD SQUAD Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-squad-reports
          path: reports/*.json
          retention-days: 30
      
      - name: Generate Summary
        if: always()
        run: |
          echo "## MOD SQUAD Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f reports/audit.json ]; then
            AUDIT_STATUS=$(jq -r '.status' reports/audit.json)
            ISSUES_FOUND=$(jq -r '.issues_found' reports/audit.json)
            echo "### 🔍 Repository Audit: **$AUDIT_STATUS**" >> $GITHUB_STEP_SUMMARY
            echo "- Issues Found: $ISSUES_FOUND" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f reports/health.json ]; then
            HEALTH_STATUS=$(jq -r '.status' reports/health.json)
            echo "### 💚 Health Checks: **$HEALTH_STATUS**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- MOD SQUAD reports available in workflow artifacts" >> $GITHUB_STEP_SUMMARY
      
      - name: Check for Critical Issues
        run: |
          if [ -f reports/audit.json ]; then
            ERRORS=$(jq -r '.errors | length' reports/audit.json)
            if [ "$ERRORS" -gt 0 ]; then
              echo "❌ Critical issues found in repository audit!"
              exit 1
            fi
          fi
          
          echo "✅ MOD SQUAD validation passed!"

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: mod-squad-validation
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build solution
        run: dotnet build -c Release --no-restore
      
      - name: Validate AppHost project
        run: |
          if [ ! -f "WolfPackAI.AppHost/WolfPackAI.AppHost.csproj" ]; then
            echo "Error: AppHost project not found"
            exit 1
          fi
          
          if ! grep -q "Aspire.Hosting.AppHost" WolfPackAI.AppHost/WolfPackAI.AppHost.csproj; then
            echo "Warning: Project may not be a valid Aspire AppHost project"
          fi
          
          echo "✅ AppHost validation complete"

